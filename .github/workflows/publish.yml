name: Publish

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@aliou"
          cache: "pnpm"

      - name: Upgrade npm for stage publish support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get release info
        id: release-info
        run: |
          pnpm changeset status --output=release.json 2>/dev/null || echo '{"releases":[]}' > release.json
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          const releases = release.releases?.filter(r => r.type !== 'none') || [];

          const dirs = fs.readdirSync('packages').filter(d => {
            const pkgPath = path.join('packages', d, 'package.json');
            return fs.statSync(path.join('packages', d)).isDirectory() && fs.existsSync(pkgPath);
          });
          const allPackages = dirs.map(d =>
            JSON.parse(fs.readFileSync(path.join('packages', d, 'package.json'), 'utf8'))
          );
          const fallbackSummary = allPackages
            .filter(pkg => pkg.name && pkg.version && !pkg.private)
            .map(pkg => pkg.name + '@' + pkg.version)
            .join(', ');

          let title = 'Updating ' + fallbackSummary;
          let commit = fallbackSummary;
          if (releases.length === 1) {
            const { name, newVersion } = releases[0];
            title = `Updating ${name} to version ${newVersion}`;
            commit = `${name}@${newVersion}`;
          } else if (releases.length > 1) {
            const summary = releases.map(r => `${r.name}@${r.newVersion}`).join(', ');
            title = `Updating ${summary}`;
            commit = summary;
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `title=${title}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\n`);
          NODE
          rm -f release.json
        continue-on-error: true

      - name: Create Release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          title: ${{ steps.release-info.outputs.title }}
          commit: ${{ steps.release-info.outputs.commit }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for unpublished packages
        id: check-publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          node <<'NODE'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const packagesDir = path.join(process.cwd(), 'packages');
          const unpublished = [];
          for (const dir of fs.readdirSync(packagesDir)) {
            const pkgPath = path.join(packagesDir, dir, 'package.json');
            if (!fs.existsSync(pkgPath)) continue;
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            if (pkg.private) continue;
            let registryVersion = '0.0.0';
            try {
              registryVersion = execSync(`npm view "${pkg.name}" version`, { stdio: ['ignore', 'pipe', 'ignore'] }).toString().trim();
            } catch {}
            if (pkg.version !== registryVersion) {
              unpublished.push({ name: pkg.name, version: pkg.version, dir: `packages/${dir}` });
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `packages=${JSON.stringify(unpublished)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `needs_staging=${unpublished.length > 0}\n`);
          NODE

      - name: Stage packages
        if: steps.check-publish.outputs.needs_staging == 'true'
        run: |
          for row in $(PACKAGES_JSON='${{ steps.check-publish.outputs.packages }}' node -e "JSON.parse(process.env.PACKAGES_JSON).forEach(p=>console.log(p.dir))"); do
            echo "Staging $row"
            (cd "$row" && npm stage publish)
          done
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub releases
        if: steps.check-publish.outputs.needs_staging == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGES_JSON='${{ steps.check-publish.outputs.packages }}' node -e "JSON.parse(process.env.PACKAGES_JSON).forEach(p=>console.log([p.name,p.version,p.dir].join('\\t')))" > /tmp/releases.tsv
          while IFS=$'\t' read -r NAME VERSION DIR; do
            TAG="$NAME@$VERSION"
            git tag "$TAG"
            git push origin "$TAG"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              awk -v v="$VERSION" "
                \$0 == \"## \" v { found=1; next }
                found && /^## / { exit }
                found { print }
              " "$DIR/CHANGELOG.md" > /tmp/release-notes.md
              gh release create "$TAG" --title "$TAG" --notes-file /tmp/release-notes.md
            fi
          done < /tmp/releases.tsv
